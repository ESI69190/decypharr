name: Publish Synology Decypharr v2.7 avoton

on:
  workflow_dispatch:
  push:
    branches:
      - release-v2.7
    paths:
      - '.github/workflows/synology-package.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: synology-release-v2.7
  cancel-in-progress: true

jobs:
  publish:
    name: Publish DSM 7.3 avoton package
    runs-on: ubuntu-latest
    steps:
      - name: Download validated avoton artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          gh run download 38960794805 \
            --repo "${GITHUB_REPOSITORY}" \
            --name synology-DSM-7.3-avoton \
            --dir release
          find release -maxdepth 1 -type f -print

      - name: Build checksum manifest
        run: |
          cd release
          find . -maxdepth 1 -type f -name '*.spk' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.7"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "decypharr ${TAG}" \
              --notes "Native Synology DSM 7.3 avoton package for Decypharr v2.7. Includes DSM FUSE compatibility and SynoPlex runtime permission fixes."
          fi
          gh release upload "${TAG}" release/*.spk release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
