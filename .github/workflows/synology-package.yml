name: Synology DSM and SRM packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'synology/**'
      - '.github/workflows/synology-package.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'synology/**'
      - '.github/workflows/synology-package.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: write

concurrency:
  group: synology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  SPKSRC_REF: e353e52f6117f59326550ece07ca0c68903a57fc

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.version }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - platform: DSM
            version: '7.0'
            arch: x64
            target: x64-7.0
          - platform: DSM
            version: '7.0'
            arch: aarch64
            target: aarch64-7.0
          - platform: DSM
            version: '7.0'
            arch: armv7
            target: armv7-7.0
          - platform: DSM
            version: '7.0'
            arch: evansport
            target: evansport-7.0
          - platform: DSM
            version: '7.0'
            arch: comcerto2k
            target: comcerto2k-7.0

          - platform: DSM
            version: '7.1'
            arch: x64
            target: x64-7.1
          - platform: DSM
            version: '7.1'
            arch: aarch64
            target: aarch64-7.1
          - platform: DSM
            version: '7.1'
            arch: armv7
            target: armv7-7.1
          - platform: DSM
            version: '7.1'
            arch: evansport
            target: evansport-7.1
          - platform: DSM
            version: '7.1'
            arch: comcerto2k
            target: comcerto2k-7.1

          - platform: DSM
            version: '7.2'
            arch: x64
            target: x64-7.2
          - platform: DSM
            version: '7.2'
            arch: aarch64
            target: aarch64-7.2
          - platform: DSM
            version: '7.2'
            arch: armv7
            target: armv7-7.2

          - platform: DSM
            version: '7.3'
            arch: x64
            target: x64-7.3
          - platform: DSM
            version: '7.3'
            arch: aarch64
            target: aarch64-7.3
          - platform: DSM
            version: '7.3'
            arch: armv7
            target: armv7-7.3

          - platform: SRM
            version: '1.2'
            arch: armv7
            target: armv7-1.2

          - platform: SRM
            version: '1.3'
            arch: aarch64
            target: aarch64-1.3
          - platform: SRM
            version: '1.3'
            arch: armv7
            target: armv7-1.3

    steps:
      - name: Checkout Decypharr
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive package version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Prepare pinned spksrc tree
        env:
          DECYPHARR_GIT_HASH: ${{ steps.meta.outputs.source_sha }}
          SPKSRC_DIR: ${{ github.workspace }}/.synology-build/spksrc
        run: bash synology/prepare-spksrc.sh

      - name: Cache spksrc toolchain and Go modules
        uses: actions/cache@v4
        with:
          path: |
            .synology-build/spksrc/toolchain/*/work
            .synology-build/spksrc/distrib/go
          key: synology-${{ matrix.target }}-${{ hashFiles('go.sum', 'synology/cross/decypharr/Makefile', 'synology/spk/decypharr/Makefile') }}
          restore-keys: |
            synology-${{ matrix.target }}-

      - name: Build SPK
        env:
          DECYPHARR_GIT_HASH: ${{ steps.meta.outputs.source_sha }}
          DECYPHARR_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm             -e DECYPHARR_GIT_HASH             -e DECYPHARR_VERSION             -v "${PWD}/.synology-build/spksrc:/spksrc"             -w /spksrc             ghcr.io/synocommunity/spksrc:latest             make -C spk/decypharr "arch-${{ matrix.target }}"

      - name: Collect package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p out

          mapfile -t packages < <(find .synology-build/spksrc/packages -maxdepth 1 -type f -name 'decypharr*.spk' -print | sort)

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Decypharr SPK, found ${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          PLATFORM="$(printf '%s' "${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')"
          OUTPUT="out/decypharr-${VERSION}-${PLATFORM}${{ matrix.version }}-${{ matrix.arch }}.spk"

          cp "${packages[0]}" "${OUTPUT}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

          echo "file=${OUTPUT}" >> "${GITHUB_OUTPUT}"

      - name: Upload SPK
        uses: actions/upload-artifact@v4
        with:
          name: synology-${{ matrix.platform }}-${{ matrix.version }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Collect build diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          find .synology-build/spksrc/spk/decypharr             -type f \( -name '*.log' -o -name 'INFO' -o -name 'PLIST' \)             -exec cp --parents {} diagnostics/ \; 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.version }}-${{ matrix.arch }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Attach Synology packages to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all Synology artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: synology-*
          path: release
          merge-multiple: true

      - name: Build checksum manifest
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f -name '*.spk' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # The main release workflow normally creates the release first. The
          # Synology build is slower, so wait briefly for that release and only
          # create it ourselves if it still does not exist.
          for attempt in {1..40}; do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              break
            fi
            sleep 15
          done

          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}"               --repo "${GITHUB_REPOSITORY}"               --title "decypharr ${TAG}"               --generate-notes
          fi

          gh release upload "${TAG}" release/*.spk release/SHA256SUMS             --repo "${GITHUB_REPOSITORY}"             --clobber
